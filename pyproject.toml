[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "1.0.0"
description = "Comprehensive Security Gateway & Poisoning Defense for Model Context Protocol (MCP)"
readme = "ROADMAP.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tran Nhat Minh" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "tool-poisoning",
    "prompt-injection",
    "confused-deputy"
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
